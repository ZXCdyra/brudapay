# Zeabur Docker Compose
# Деплоим 3 сервиса: frontend, backend, postgres

version: '3.8'

services:
  # ============================================
  # Backend API (Go + Next.js)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.zeabur
    container_name: zeabur-paymentsgate
    environment:
      - SERVER_PORT=8080
      - ENVIRONMENT=production
      - BASE_URL=${BASE_URL}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_NAME}?sslmode=disable
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_TTL_MINUTES=15
      - JWT_REFRESH_TTL_HOURS=168
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RATE_LIMIT_RPS=100
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_DISPUTE_CHAT_ID=${TELEGRAM_DISPUTE_CHAT_ID}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always
    networks:
      - zeabur-network

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: zeabur-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d/migrations
    ports:
      - "5432:5432"
    restart: always
    networks:
      - zeabur-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Telegram Bot (Python)
  # ============================================
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: zeabur-telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BASE_URL=${BASE_URL}
      - TELEGRAM_DISPUTE_CHAT_ID=${TELEGRAM_DISPUTE_CHAT_ID}
    restart: always
    networks:
      - zeabur-network

volumes:
  postgres_data:
    driver: local

networks:
  zeabur-network:
    driver: bridge
