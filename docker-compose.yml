services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-paymentsgate
    environment:
      POSTGRES_USER: ${DB_USER:-paymentsgate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paymentsgate}
      POSTGRES_DB: ${DB_NAME:-paymentsgate}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paymentsgate}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api-paymentsgate
    environment:
      - SERVER_PORT=8080
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BASE_URL=${BASE_URL:-http://localhost}
      - DATABASE_URL=postgres://${DB_USER:-paymentsgate}:${DB_PASSWORD:-paymentsgate}@postgres:5432/${DB_NAME:-paymentsgate}?sslmode=require
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change-this-to-strong-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-this-to-strong-secret}
      - JWT_ACCESS_TTL_MINUTES=15
      - JWT_REFRESH_TTL_HOURS=168
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-to-32-byte-key!!!}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-100}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_DISPUTE_CHAT_ID=${TELEGRAM_DISPUTE_CHAT_ID:-}
      - NODE_ENV=production
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_WS_URL=/ws
    container_name: ui-paymentsgate
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
      - NODE_ENV=production
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-paymentsgate
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
