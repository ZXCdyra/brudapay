services:
  # ============================================
  # Backend API + Telegram Bot (Web Service)
  # ============================================
  - type: web
    name: platega-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerfilePath: ./backend/Dockerfile.render
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DISPUTE_CHAT_ID
        sync: false
      - key: RATE_LIMIT_RPS
        value: "100"

  # ============================================
  # Frontend (Static Site) - БЕСПЛАТНО
  # ============================================
  - type: static
    name: platega-frontend
    region: oregon
    buildCommand: npm install && npm run build
    serveCommand: echo "Next.js standalone"
    pullRequestPreviewsEnabled: true
    directory: ./frontend
    env: next
