services:
  # ============================================
  # Backend API + Telegram Bot (Web Service)
  # ============================================
  - type: web
    name: platega-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DISPUTE_CHAT_ID
        sync: false
      - key: RATE_LIMIT_RPS
        value: "100"
      - key: BASE_URL
        value: https://platega-frontend.onrender.com

  # ============================================
  # Frontend (Next.js Docker) - БЕСПЛАТНО
  # ============================================
  - type: web
    name: platega-frontend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./frontend/Dockerfile.render
    port: 10000
    envVars:
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_API_URL
        value: https://platega-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://platega-backend.onrender.com
