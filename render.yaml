services:
  # ============================================
  # Backend API + Frontend + Telegram Bot (один сервис)
  # ============================================
  - type: web
    name: platega
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://platega-backend.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://platega-backend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DISPUTE_CHAT_ID
        sync: false
      - key: RATE_LIMIT_RPS
        value: "100"
