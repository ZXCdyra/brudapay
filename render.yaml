# Render Blueprint — деплой проекта на Render.com
# https://dashboard.render.com/select-new-api
# 1. Зайди в Dashboard → New → Blueprint
# 2. Укажи URL этого репозитория
# 3. Заполни приватные env vars (JWT, ENCRYPTION_KEY, TELEGRAM)
# 4. Deploy

services:
  # ===== GO BACKEND (Private Web Service) =====
  - type: web
    name: brudapay-backend
    env: go
    region: frankfurt
    plan: standard
    branch: main
    buildCommand: go build -ldflags="-s -w" -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: SERVER_PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: brudapay-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: RATE_LIMIT_RPS
        value: "100"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DISPUTE_CHAT_ID
        sync: false

  # ===== NEXT.JS FRONTEND (Private Web Service) =====
  - type: web
    name: brudapay-frontend
    env: node
    region: frankfurt
    plan: standard
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npx next start
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: brudapay-backend
          property: internalUrl
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: brudapay-backend
          property: internalUrl

databases:
  - name: brudapay-db
    region: frankfurt
    plan: standard
    databaseName: brudapay
    databaseUser: brudapay
