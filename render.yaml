# Render Blueprint — Telegram WebApp (один сервис)

services:
  # ===== GO BACKEND + FRONTEND (один сервис) =====
  - type: web
    name: brudapay
    env: docker
    region: frankfurt
    plan: standard
    branch: main
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: SERVER_PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: brudapay-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: RATE_LIMIT_RPS
        value: "100"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DISPUTE_CHAT_ID
        sync: false
      - key: FRONTEND_DIR
        value: ./frontend/.next/standalone

databases:
  - name: brudapay-db
    region: frankfurt
    plan: standard
    databaseName: brudapay
