services:
  # ============================================
  # Backend API + Telegram Bot (один сервис)
  # ============================================
  - type: web
    name: platega-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DISPUTE_CHAT_ID
        sync: false
      - key: RATE_LIMIT_RPS
        value: "100"
      - key: FRONTEND_URL
        value: https://platega-frontend.onrender.com

  # ============================================
  # Frontend (Next.js)
  # ============================================
  - type: web
    name: platega-frontend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./frontend/Dockerfile.render
    port: 10000
    envVars:
      - key: PORT
        value: "10000"
